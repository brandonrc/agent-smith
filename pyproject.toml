[project]
name = "agent-smith"
version = "0.1.0"
description = "Terminal-based AI coding assistant powered by Claude, GPT, and more"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Agent Smith Contributors"}
]
readme = "README.md"
keywords = ["ai", "llm", "coding-assistant", "claude", "gpt", "terminal", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Configuration Management
    "dynaconf>=3.2.0",
    "platformdirs>=4.0.0",
    "keyring>=25.0.0",
    "python-dotenv>=1.0.0",
    # LLM APIs
    "anthropic>=0.39.0",
    "openai>=1.54.0",
    # Terminal UI
    "textual>=0.47.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    # Core Utilities
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "aiofiles>=23.2.0",
    "orjson>=3.9.0",
    # Utilities
    "python-dateutil>=2.8.0",
    "humanize>=4.9.0",
    # Error Tracking
    "sentry-sdk>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/brandonrc/agent-smith"
Issues = "https://github.com/brandonrc/agent-smith/issues"
Repository = "https://github.com/brandonrc/agent-smith.git"
Documentation = "https://github.com/brandonrc/agent-smith/tree/main/docs"

[project.scripts]
smith = "agent_smith.cli:app"
agent-smith = "agent_smith.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.8.0",
    "ruff>=0.2.0",
    "black>=24.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_smith"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = false
warn_unused_configs = false
disallow_untyped_defs = false
disallow_any_unimported = false
no_implicit_optional = false
warn_redundant_casts = false
warn_unused_ignores = false
ignore_missing_imports = true
disable_error_code = ["override", "assignment", "arg-type", "attr-defined", "misc", "union-attr", "annotation-unchecked", "import-untyped"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]  # Line too long (handled by black)

[tool.black]
line-length = 88
target-version = ["py311"]
